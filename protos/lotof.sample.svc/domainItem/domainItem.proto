syntax = "proto3";

option go_package = "app/internal/core/grpc/generated/lotof.sample.svc/domainItem";

package domainItem;

import "generic/utils/filter.proto";
import "generic/utils/list.proto";

// SampleDomainItemService is the example CRUD service this template ships
// with, wired end to end (proto -> svc repo/ent/ctrl -> gtw resolvers) so a
// new service can be bootstrapped by deleting/renaming this one module
// instead of wiring a domain from scratch. See each repo's README for the
// exact rename/delete steps.
service SampleDomainItemService {
  rpc CreateDomainItem(CreateDomainItemRequest) returns (DomainItem);
  rpc GetDomainItem(GetDomainItemRequest) returns (DomainItem);
  rpc ListDomainItems(ListDomainItemsRequest) returns (ListDomainItemsResponse);
  rpc UpdateDomainItem(UpdateDomainItemRequest) returns (DomainItem);
  rpc DeleteDomainItem(DeleteDomainItemRequest) returns (DeleteDomainItemResponse);
}

enum DomainItemStatus {
  ACTIVE = 0;
  ARCHIVED = 1;
}

message DomainItem {
  string id = 1;
  string name = 2;
  DomainItemStatus status = 3;
}

message CreateDomainItemRequest {
  string name = 1;
}

message GetDomainItemRequest {
  string id = 1;
}

message ListDomainItemsRequest {
  utils.Pagination pagination = 1;
}

message ListDomainItemsResponse {
  repeated DomainItem domain_items = 1;
  utils.PaginationInfo pagination_info = 2;
}

message UpdateDomainItemRequest {
  string id = 1;
  string name = 2;
  DomainItemStatus status = 3;
}

message DeleteDomainItemRequest {
  string id = 1;
}

message DeleteDomainItemResponse {
  bool success = 1;
}
